# fly.toml app configuration file generated for ceo-summit on 2026-11-26T00:29:55Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ceo-summit'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  PORT = '8080'

[[mounts]]
  source = 'summit_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
